[mgr]
prepend_keymap = [
  { on = "<Esc>", run = "plugin smart-esc" },
  { on = "q", run = "quit --no-cwd-file" },

  { on = "<C-k>", run = "leave" },
  { on = "l", run = "plugin smart-enter" },
  { on = "<C-j>", run = "plugin smart-enter" },

  { on = "<C-l>", run = "escape" },

  { on = "<Space>", run = [
    "toggle",
    "escape --visual",
  ] },

  # nvim directory or yazi's initial path
  { on = "<C-Space>", run = 'shell -- ya emit cd "${NVIM_CWD:-${YAZI_START_CWD:-$(git rev-parse --show-toplevel 2>/dev/null)}}"' },

  # nvim buffer
  { on = "<C-h>", run = "plugin nvim-buffer" },

  { on = "<C-n>", run = "find --smart" },
  { on = "<A-n>", run = "find --previous --smart" },

  { on = "<C-w>", run = "spot" },

  { on = "<C-o>", run = "back" },
  { on = "<C-i>", run = "forward" },
  { on = "<Tab>", run = "forward" },

  { on = "s", run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
  { on = "e", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },

  { on = [
    "b",
    "d",
  ], run = "plugin bookmarks delete", desc = "Delete a bookmark" },

  { on = [
    "b",
    "D",
  ], run = "plugin bookmarks delete_all", desc = "Delete all bookmarks" },

  { on = "'", run = "plugin bookmarks jump", desc = "Jump to a bookmark" },
  { on = "o", run = "plugin bookmarks jump", desc = "Jump to a bookmark" },
  { on = "m", run = "plugin bookmarks save", desc = "Save current position as a bookmark" },

  { on = [
    "M",
    "s",
  ], run = "linemode size" },
  { on = [
    "M",
    "p",
  ], run = "linemode permissions" },
  { on = [
    "M",
    "b",
  ], run = "linemode btime" },
  { on = [
    "M",
    "m",
  ], run = "linemode mtime" },
  { on = [
    "M",
    "o",
  ], run = "linemode owner" },
  { on = [
    "M",
    "n",
  ], run = "linemode none" },
]

[tasks]
prepend_keymap = [
  { on = "<C-k>", run = "close" },
  { on = "<C-j>", run = "inspect" },
]

[spot]
prepend_keymap = [
  { on = "<C-k>", run = "close" },
  { on = "<C-w>", run = "close" },
  { on = "<Tab>", run = "noop" },
]

[pick]
prepend_keymap = [
  { on = "<C-k>", run = "close" },
  { on = "<C-j>", run = "close --submit" },
]

[input]
prepend_keymap = [
  { on = "<Esc>", run = "close" },
  { on = "<C-k>", run = "close" },
  { on = "<C-j>", run = "close --submit" },
]

[confirm]
prepend_keymap = [
  { on = "<C-k>", run = "close" },
  { on = "<C-j>", run = "close --submit" },
]

[cmp]
prepend_keymap = [{ on = "<C-l>", run = "close --submit" }]

[help]
prepend_keymap = [
  { on = "<Esc>", run = "close" },
  { on = "<C-k>", run = "close" },
]
